name: Build Windows portable folder
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --onedir --name PersianPodcastStudio --collect-all gradio --collect-all gradio_client --collect-all edge_tts app.py
      - uses: actions/upload-artifact@v4
        with:
          name: PersianPodcastStudio-Windows
          path: dist/PersianPodcastStudio
